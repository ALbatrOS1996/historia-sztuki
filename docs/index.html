<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ars – historia sztuki</title>
<meta name="description" content="Nauka historii sztuki od prehistorii do awangardy: epoki, dzieła, pojęcia, fiszki i ćwiczenia.">
<meta name="theme-color" content="#f3f1ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f3f1ee; --surface: #ffffff; --surface2: #f8f6f3; --ink: #1d1a17; --muted: #8a837b; --line: #e7e2dc;
  --accent: #a96c45; --accent-d: #8d5533; --accent-soft: #f3e7de; --good: #4f7d5a; --bad: #b4473c;
  --glass: rgba(255, 255, 255, .22); --glass-b: rgba(255, 255, 255, .35); --shadow: 0 10px 30px rgba(40, 28, 18, .08);
  --r: 14px; --serif: 'Merriweather', Georgia, serif; --text: 'Source Serif 4', Georgia, serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #16130f; --surface: #221d18; --surface2: #1b1713; --ink: #f1ebe3; --muted: #a39a8f; --line: #3a322a;
  --accent: #c98a5e; --accent-d: #e0a77d; --accent-soft: #3a2a1f; --good: #7fb08a; --bad: #e07a6e;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--text); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
h1, h2, h3 { font-family: var(--serif); line-height: 1.2; margin: 0; }
.ic { width: 22px; height: 22px; flex: none; }
.muted { color: var(--muted); }
#app { max-width: 1120px; margin: 0 auto; padding: 0 16px 110px; min-height: 100vh; }
#app.v-dzielo, #app.v-start { padding: 0; max-width: none; }
.pad { padding-top: 4px; }

/* nagłówek */
.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; position: sticky; top: 0; z-index: 20; background: var(--bg); }
.brand { font-family: var(--serif); font-weight: 700; font-size: 26px; color: var(--accent); letter-spacing: .3px; }
.brand.big { font-size: 30px; }
.sq { width: 46px; height: 46px; border-radius: 12px; background: var(--surface); display: inline-grid; place-items: center; box-shadow: var(--shadow); position: relative; color: var(--ink); }
.sq.brown { background: var(--accent); color: #fff; }
.sq.ghost { box-shadow: none; background: transparent; }
.sq.glass { background: var(--glass); color: #fff; backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); box-shadow: inset 0 0 0 1px var(--glass-b); }
.sq .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* wyszukiwarka i zakładki */
.searchrow { display: flex; gap: 10px; margin: 6px 0 14px; }
.search { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 12px; padding: 0 14px; height: 50px; box-shadow: var(--shadow); color: var(--muted); }
.search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; color: var(--ink); font-size: 16px; }
.searchrow .sq { width: 50px; height: 50px; }
.tabs { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 16px; padding: 0 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { white-space: nowrap; padding: 6px 0; color: var(--ink); opacity: .75; font-size: 16.5px; border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--accent); opacity: 1; border-color: var(--accent); }

/* karty epok */
.cards { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .cards { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1040px) { .cards { grid-template-columns: 1fr 1fr 1fr; } }
.card { position: relative; display: block; height: 360px; border-radius: 4px; overflow: hidden; background: #2b241d; box-shadow: var(--shadow); }
.card > img, .card > .noimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
.card:hover > img { transform: scale(1.04); }
.card::after { content: ''; position: absolute; inset: 45% 0 0; background: linear-gradient(to bottom, transparent, rgba(20, 14, 8, .55)); pointer-events: none; }
.card .panel, .card .chips { z-index: 1; }
.chips { position: absolute; top: 14px; left: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-block; font-size: 12.5px; padding: 3px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-d); }
.chip.glass { background: rgba(40, 60, 110, .35); color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.glass.panel { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 12px 14px 12px; color: #fff; border-radius: 6px;
  background: rgba(255, 255, 255, .12); backdrop-filter: blur(16px) saturate(1.15); -webkit-backdrop-filter: blur(16px) saturate(1.15); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); text-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
.panel h3 { font-size: 19px; font-weight: 400; }
.panel .where { display: flex; gap: 6px; align-items: center; font-size: 13.5px; margin: 4px 0 8px; opacity: .95; }
.panel .where .ic { width: 15px; height: 15px; }
.panel .row { display: flex; justify-content: space-between; font-size: 13.5px; border-top: 1px solid rgba(255, 255, 255, .3); padding-top: 8px; }
.bar { height: 4px; border-radius: 4px; background: rgba(127, 110, 95, .25); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .6s; }
.panel .bar { background: rgba(255, 255, 255, .3); }
.panel .bar i { background: #fff; }
.noimg { display: grid; place-items: center; background: var(--surface2); color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; }

/* START */
.start { min-height: 100vh; min-height: 100dvh; background: var(--surface); display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; overflow: hidden; }
@media (min-width: 700px) { .start { margin: 24px auto; min-height: calc(100vh - 48px); border-radius: 36px; box-shadow: var(--shadow); } }
.start-top { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px 0; position: relative; z-index: 2; }
.start { height: 100vh; height: 100dvh; min-height: 640px; }
@media (min-width: 700px) { .start { height: calc(100vh - 48px); max-height: 900px; } }
.statue { flex: 1; position: relative; min-height: 0; margin-top: -40px; }
.statue img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; filter: grayscale(1) contrast(1.05) brightness(1.08);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18%, #000 62%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 18%, #000 62%, transparent 100%); opacity: .9; }
:root[data-theme="dark"] .statue img { filter: grayscale(1) brightness(.8); }
.start-txt { padding: 0 24px 30px; position: relative; z-index: 2; margin-top: -60px; }
.start h1 { font-size: clamp(32px, 9vw, 44px); font-weight: 900; letter-spacing: -.5px; }
.start h1 em { font-family: var(--text); font-weight: 300; color: var(--muted); font-style: italic; }
.stats { display: flex; gap: 22px; margin: 20px 0 22px; }
.stats .lbl { display: flex; align-items: center; gap: 6px; font-style: italic; font-size: 15px; }
.stats .lbl .ic { width: 16px; height: 16px; color: var(--accent); }
.stats b { display: block; font-family: var(--serif); font-size: 21px; padding-left: 22px; }
.start-xp { text-align: center; color: var(--muted); font-size: 14px; display: flex; gap: 6px; justify-content: center; align-items: center; margin: 14px 0 0; }
.start-xp .ic { width: 16px; height: 16px; color: var(--accent); }

/* przyciski */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 4px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 16px; cursor: pointer; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: none; }
.btn.primary:hover { background: var(--accent-d); }
.btn.danger { color: var(--bad); }
.btn.wide { width: 100%; margin-top: 10px; }
.btn .ic { width: 18px; height: 18px; }

/* EPOKA */
.v-epoka .top { display: none; }
.era-hero { position: relative; height: 46vh; min-height: 300px; max-height: 480px; margin: 0 -16px; overflow: hidden; background: #2b241d; }
@media (min-width: 1152px) { .era-hero { margin: 0; border-radius: 0 0 6px 6px; } }
.era-hero > img, .era-hero > .noimg { width: 100%; height: 100%; object-fit: cover; }
.era-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0, 0, 0, .25), transparent 30%, transparent 50%, rgba(0, 0, 0, .65)); }
.era-top { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 2; }
.era-title { position: absolute; left: 20px; right: 20px; bottom: 20px; z-index: 2; color: #fff; }
.era-title h1 { font-size: clamp(26px, 6vw, 40px); font-weight: 700; margin-top: 8px; text-shadow: 0 2px 14px rgba(0, 0, 0, .4); }
.era-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 12px 0; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.era-tabs::-webkit-scrollbar { display: none; }
.era-tabs a { padding: 8px 16px; border-radius: 30px; white-space: nowrap; font-size: 15.5px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.era-tabs a.on { background: var(--accent); color: #fff; box-shadow: none; }
.era-body { max-width: 720px; margin: 0 auto; padding-top: 8px; }
.lead { font-size: 19px; line-height: 1.55; font-style: italic; color: var(--ink); margin: 10px 0 18px; }
.lead.small { font-size: 16px; color: var(--muted); }
.era-body h2 { font-size: 21px; margin: 26px 0 8px; }
.era-body p { margin: 0 0 12px; }
.drop::first-letter { font-family: var(--serif); float: left; font-size: 3.3em; line-height: .85; padding: 6px 8px 0 0; color: var(--accent); font-weight: 700; }
.box { background: var(--surface); border-radius: var(--r); padding: 18px 20px; margin: 26px 0; box-shadow: var(--shadow); border-left: 3px solid var(--accent); }
.box h3 { display: flex; align-items: center; gap: 8px; font-size: 18px; margin-bottom: 8px; color: var(--accent-d); }
.box ul { margin: 0; padding-left: 20px; }
.box li { margin: 4px 0; }
.qa { background: var(--surface); border-radius: 10px; margin: 8px 0; box-shadow: inset 0 0 0 1px var(--line); }
.qa summary { padding: 14px 16px; cursor: pointer; font-weight: 600; list-style: none; }
.qa summary::-webkit-details-marker { display: none; }
.qa summary::before { content: '?'; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-d); margin-right: 10px; font-family: var(--serif); font-size: 14px; }
.qa p { padding: 0 16px 14px 50px; color: var(--ink); }
.src { font-size: 13.5px; color: var(--muted); margin-top: 20px; }
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 20px; }
.strip a { display: block; }
.strip img, .strip .noimg { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 4px; }
.strip span { display: block; font-size: 12.5px; line-height: 1.3; color: var(--muted); margin-top: 4px; }
.era-nav { display: flex; justify-content: space-between; gap: 10px; margin: 34px 0 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.era-nav a { display: flex; align-items: center; gap: 6px; font-size: 14.5px; color: var(--accent-d); max-width: 48%; }
.era-nav a:last-child { text-align: right; }

/* kafle dzieł */
.masonry { columns: 2; column-gap: 12px; }
@media (min-width: 720px) { .masonry { columns: 3; } }
@media (min-width: 1040px) { #gal.masonry { columns: 4; } }
.tile { display: block; break-inside: avoid; margin-bottom: 12px; background: var(--surface); border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); position: relative; }
.tile img, .tile .noimg { width: 100%; display: block; min-height: 100px; }
.tile div { padding: 9px 11px 11px; }
.tile b { display: block; font-family: var(--serif); font-size: 14.5px; font-weight: 400; line-height: 1.3; }
.tile span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.35; margin-top: 3px; }
.tile.ok::after, .term.ok::after { content: '✓'; position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: #fff; font-size: 13px; display: grid; place-items: center; }
.terms { display: grid; gap: 10px; margin-bottom: 14px; }
@media (min-width: 720px) { .terms.pad { grid-template-columns: 1fr 1fr; } }
.term { background: var(--surface); padding: 14px 16px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); position: relative; }
.term b { font-family: var(--serif); color: var(--accent-d); }
.term p { margin: 4px 0 0; font-size: 15.5px; }
.term a { font-size: 13px; }
.artists { display: grid; gap: 12px; }
@media (min-width: 720px) { .artists.pad { grid-template-columns: 1fr 1fr; } }
.artist { display: flex; gap: 14px; background: var(--surface); padding: 14px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); }
.artist .av { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; flex: none; }
.artist b { font-family: var(--serif); display: block; }
.artist .muted { font-size: 13.5px; }
.artist p { margin: 4px 0 0; font-size: 15px; }
.artist .muted a { color: var(--accent-d); }

/* ćwiczenia */
.sec { font-size: 18px; margin: 24px 0 10px; }
.ex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 720px) { .ex-grid { grid-template-columns: repeat(3, 1fr); } }
.ex { background: var(--surface); padding: 16px; border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; transition: transform .15s; }
.ex:active { transform: scale(.97); }
.ex .ic { color: var(--accent); width: 26px; height: 26px; margin-bottom: 4px; }
.ex b { font-family: var(--serif); font-weight: 400; font-size: 16px; line-height: 1.25; }
.ex span { font-size: 13.5px; color: var(--muted); line-height: 1.35; }
.scope { display: flex; gap: 8px; flex-wrap: wrap; }
.scope button, .era-pills a { padding: 7px 14px; border-radius: 30px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 14.5px; }
.scope button.on { background: var(--accent); color: #fff; box-shadow: none; }
.era-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.goal { display: flex; align-items: center; gap: 16px; background: var(--surface); padding: 14px 16px; border-radius: 14px; box-shadow: var(--shadow); }
.goal b { font-family: var(--serif); display: block; }
.goal .muted { font-size: 14px; }
.ring { width: 64px; height: 64px; flex: none; transform: rotate(-90deg); }
.ring circle { fill: none; stroke: var(--line); stroke-width: 6; }
.ring circle.v { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .8s; }
.ring text { transform: rotate(90deg); transform-origin: 32px 32px; font: 700 17px var(--serif); fill: var(--ink); text-anchor: middle; }

/* quiz */
.quiz, .flash { max-width: 640px; margin: 0 auto; padding-top: 12px; }
.qz-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.qz-top .sq { box-shadow: none; background: transparent; width: 40px; }
.qz-bar { flex: 1; height: 8px; background: var(--line); border-radius: 8px; overflow: hidden; }
.qz-bar i { display: block; height: 100%; background: var(--accent); border-radius: 8px; transition: width .4s; }
.qz-xp { display: flex; align-items: center; gap: 4px; font-family: var(--serif); color: var(--accent-d); font-size: 15px; }
.qz-xp .ic { width: 18px; height: 18px; }
.qz-kind { text-transform: uppercase; letter-spacing: 1.5px; font-size: 12.5px; color: var(--accent); margin: 0 0 8px; }
.qz-img { border-radius: 8px; overflow: hidden; background: #1c1814; height: 42vh; max-height: 380px; min-height: 220px; margin-bottom: 14px; }
.qz-img img { width: 100%; height: 100%; object-fit: contain; transition: transform .8s ease; }
.qz-img.crop img { object-fit: cover; }
.qz-q { font-size: 20px; font-weight: 400; margin-bottom: 16px; line-height: 1.4; }
.qz-q .def { display: block; font-family: var(--text); font-style: italic; font-size: 18px; background: var(--surface); padding: 12px 14px; border-radius: 8px; margin: 4px 0 10px; box-shadow: inset 3px 0 0 var(--accent); }
.opts { display: grid; gap: 10px; }
.opts button { text-align: left; padding: 14px 16px; background: var(--surface); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); font-size: 16.5px; line-height: 1.35; transition: background .2s; }
.opts.small button { font-size: 15px; }
.opts button:not(:disabled):hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
.opts button.right { background: var(--good); color: #fff; box-shadow: none; }
.opts button.wrong { background: var(--bad); color: #fff; box-shadow: none; }
.opts.tf { grid-template-columns: 1fr 1fr; }
.opts.tf button { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--serif); }
.feedback { display: none; margin-top: 16px; padding: 16px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
.feedback.on { display: block; animation: rise .3s ease; }
.feedback > b { display: flex; align-items: center; gap: 6px; font-family: var(--serif); font-size: 18px; }
.feedback.good > b { color: var(--good); } .feedback.bad > b { color: var(--bad); }
.feedback p { font-size: 15.5px; margin: 8px 0 0; }
.feedback .more { display: inline-block; margin-top: 8px; color: var(--accent-d); font-size: 15px; text-decoration: underline; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.order { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.order button { position: relative; background: var(--surface); border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); text-align: left; }
.order img, .order .noimg { width: 100%; height: 120px; object-fit: cover; display: block; }
.order span { display: block; padding: 8px 10px; font-size: 14px; line-height: 1.3; }
.order em { position: absolute; top: 8px; left: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: none; place-items: center; font: 700 15px var(--serif); font-style: normal; }
.order .picked em { display: grid; }
.order .picked { box-shadow: inset 0 0 0 2px var(--accent); }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pairs > div { display: grid; gap: 8px; align-content: start; }
.pairs button { padding: 12px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 14.5px; line-height: 1.3; text-align: left; min-height: 56px; display: flex; gap: 8px; align-items: center; }
.pairs button img { width: 42px; height: 42px; object-fit: cover; border-radius: 6px; flex: none; }
.pairs button.sel { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.pairs button.right { background: var(--good); color: #fff; box-shadow: none; opacity: .85; }
.shake { animation: shake .35s; background: var(--bad) !important; color: #fff; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.open .ans { display: none; margin-top: 12px; background: var(--surface); padding: 14px 16px; border-radius: 10px; }
.open.on .ans { display: block; } .open.on > .btn { display: none; }
.end { text-align: center; padding: 30px 0; }
.end .ring { width: 110px; height: 110px; }
.end h2 { font-size: 34px; margin: 12px 0 4px; }

/* fiszki */
.decks { display: grid; gap: 10px; }
@media (min-width: 720px) { .decks { grid-template-columns: 1fr 1fr; } }
.deck { display: flex; gap: 14px; align-items: center; background: var(--surface); padding: 16px; border-radius: 12px; box-shadow: var(--shadow); }
.deck > .ic { width: 30px; height: 30px; color: var(--accent); }
.deck > div { flex: 1; }
.deck b { font-family: var(--serif); font-weight: 400; display: block; }
.deck span { font-size: 13.5px; color: var(--muted); }
.deck em { font-style: normal; font-family: var(--serif); color: var(--accent-d); font-size: 14px; }
.fcard { position: relative; height: 56vh; min-height: 340px; max-height: 520px; perspective: 1200px; cursor: pointer; }
.face { position: absolute; inset: 0; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .55s cubic-bezier(.3, .7, .3, 1); overflow: auto; }
.face.back { transform: rotateY(180deg); border-top: 4px solid var(--accent); }
.fcard.flip .front { transform: rotateY(-180deg); } .fcard.flip .back { transform: rotateY(0); }
.face h2 { font-size: 24px; margin-bottom: 8px; }
.face p { margin: 6px 0; }
.face .fimg { max-width: 100%; max-height: 82%; object-fit: contain; border-radius: 6px; }
.face .hint { position: absolute; bottom: 12px; font-size: 13px; color: var(--muted); }
.flist { text-align: left; margin: 0 0 12px; padding-left: 18px; font-size: 16px; }
.boxes { text-align: center; margin: 14px 0; }
.boxes i { display: inline-block; width: 26px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 3px; }
.boxes i.on { background: var(--accent); }

/* galeria / listy */
.selrow select { width: 100%; height: 46px; border-radius: 10px; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); padding: 0 12px; margin-bottom: 14px; }
.timeline { position: relative; padding-left: 4px; }
.tl { display: grid; grid-template-columns: 96px 18px 64px 1fr; align-items: center; gap: 10px; padding: 8px 0; }
.tl-y { font-size: 12.5px; color: var(--muted); text-align: right; line-height: 1.25; }
.tl i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); justify-self: center; position: relative; }
.tl img, .tl .noimg { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
.tl b { font-family: var(--serif); font-weight: 400; font-size: 15.5px; line-height: 1.3; }
.days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; height: 120px; align-items: end; margin: 18px 0 6px; }
.days div { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.days i { width: 100%; max-width: 18px; background: var(--accent-soft); border-radius: 4px 4px 0 0; min-height: 2px; }
.days i.full { background: var(--accent); }
.days span { font-size: 11px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
.kpis div { background: var(--surface); border-radius: 12px; padding: 14px 10px; text-align: center; box-shadow: var(--shadow); }
.kpis b { font-family: var(--serif); font-size: 24px; display: block; color: var(--accent-d); }
.kpis span { font-size: 12.5px; color: var(--muted); line-height: 1.3; display: block; }
.prog { display: grid; grid-template-columns: 1fr 90px 42px; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.prog .bar { margin: 0; }
.prog b { font-family: var(--serif); font-size: 14px; text-align: right; color: var(--accent-d); }
.settings { display: flex; flex-wrap: wrap; gap: 8px; }

/* dolna nawigacja */
#nav { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 2px; padding: 6px; border-radius: 18px; z-index: 40;
  background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 10px 30px rgba(40, 28, 18, .16), inset 0 0 0 1px var(--line); width: min(440px, calc(100% - 24px)); }
#nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 0 5px; border-radius: 13px; font-size: 11.5px; color: var(--muted); }
#nav a.on { color: var(--accent); background: var(--accent-soft); }
#nav .ic { width: 22px; height: 22px; }

/* menu boczne */
.drawer { position: fixed; inset: 0; background: rgba(20, 14, 8, 0); z-index: 60; transition: background .3s; }
.drawer nav { position: absolute; left: 0; top: 0; bottom: 0; width: min(300px, 82vw); background: var(--surface); padding: 26px 18px; transform: translateX(-100%); transition: transform .3s ease; display: flex; flex-direction: column; gap: 4px; }
.drawer.on { background: rgba(20, 14, 8, .35); } .drawer.on nav { transform: none; }
.drawer .brand { margin: 0 8px 18px; }
.drawer a { display: flex; gap: 12px; align-items: center; padding: 12px 10px; border-radius: 10px; font-size: 17px; }
.drawer a:hover { background: var(--accent-soft); }
.drawer a .ic { color: var(--accent); }

/* PRZEGLĄDARKA – tryb galerii */
.viewer { position: fixed; inset: 0; background: #0f0d0b; overflow: hidden; color: #fff; z-index: 50; }
.v-bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(30px) brightness(.55) saturate(1.2); }
.v-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: transform .5s ease; z-index: 1; }
.viewer.zoom .v-img { transform: scale(2.6); cursor: zoom-in; }
.v-top { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between; z-index: 3; }
.v-title { font-family: var(--serif); font-size: 18px; text-shadow: 0 1px 8px rgba(0, 0, 0, .5); }
.v-label { position: absolute; z-index: 3; top: 26%; right: 16px; display: flex; gap: 10px; align-items: center; text-align: left; max-width: 62%; padding: 6px 12px 6px 6px; border-radius: 4px;
  background: rgba(255, 255, 255, .14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .28); color: #fff; }
.v-label .th { width: 44px; height: 44px; object-fit: cover; border-radius: 3px; flex: none; }
.v-label b { display: block; font-family: var(--serif); font-weight: 400; font-size: 15px; line-height: 1.25; text-shadow: 0 1px 6px rgba(0, 0, 0, .4); }
.v-label small { font-size: 12.5px; opacity: .85; }
.v-dot { position: absolute; z-index: 3; top: calc(26% + 70px); left: 26%; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; background: rgba(255, 255, 255, .3); animation: pulse 2s infinite; }
.v-line { position: absolute; z-index: 2; top: calc(26% + 50px); left: calc(26% + 12px); width: 18%; height: 1px; background: rgba(255, 255, 255, .7); transform: rotate(-24deg); transform-origin: left; }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); } 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .5); } }
.viewer.zoom .v-label, .viewer.zoom .v-dot, .viewer.zoom .v-line, .viewer.zoom .v-walk, .viewer.info .v-walk { opacity: 0; pointer-events: none; }
.v-walk { position: absolute; z-index: 3; left: 50%; bottom: 150px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; color: #fff; }
.v-walk .ic { width: 34px; height: 22px; margin-top: -8px; animation: walk 1.8s infinite; opacity: .2; }
.v-walk .ic:nth-child(1) { animation-delay: .4s; } .v-walk .ic:nth-child(2) { animation-delay: .2s; }
@keyframes walk { 30% { opacity: .95; } 60% { opacity: .2; } }
.v-bottom { position: absolute; z-index: 3; left: 16px; right: 16px; bottom: max(26px, env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; }
.v-bottom .sq { width: 52px; height: 52px; }
.v-bottom .sq.fav { color: #ffb6a3; background: rgba(169, 108, 69, .55); }
.v-frame { width: 66px; height: 66px; position: relative; display: grid; place-items: center; color: #fff; background: rgba(255, 255, 255, .1); backdrop-filter: blur(8px); }
.v-frame i { position: absolute; width: 14px; height: 14px; border: 2px solid #fff; }
.v-frame i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; } .v-frame i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
.v-frame i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; } .v-frame i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
.viewer.zoom .v-frame { background: var(--accent); }
.v-info { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; max-height: 72%; overflow: auto; background: var(--surface); color: var(--ink); border-radius: 22px 22px 0 0; padding: 10px 22px 28px; transform: translateY(105%); transition: transform .4s cubic-bezier(.3, .7, .3, 1); max-width: 720px; margin: 0 auto; }
.viewer.info .v-info { transform: none; }
.grip { width: 44px; height: 5px; border-radius: 4px; background: var(--line); margin: 4px auto 14px; cursor: pointer; }
.v-info h2 { font-size: 24px; margin: 12px 0 10px; }
.v-info .meta { color: var(--muted); font-size: 15px; line-height: 1.8; }
.v-info .meta .ic { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; color: var(--accent); }
.v-nav { display: flex; justify-content: space-between; gap: 10px; margin: 18px 0 8px; }
.credit { font-size: 12px; color: var(--muted); }
.credit a { text-decoration: underline; }

.toast { position: fixed; left: 50%; bottom: 100px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 30px; font-size: 15px; opacity: 0; transition: .3s; z-index: 99; white-space: nowrap; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    ['Paleolit: malowidła i figurki', 'Najsłynniejsze zespoły malowideł znajdują się w jaskiniach Lascaux (Francja) i Altamira (Hiszpania). Przedstawiają głównie zwierzęta – żubry, konie, jelenie, tury – ukazane z zadziwiającym realizmem. Malarze wykorzystywali nierówności skały, by nadać zwierzętom wypukłość, stosowali modelunek i różne natężenie plam barwnych. Barwniki pozyskiwano z ochry, węgla drzewnego i tlenków manganu. Malowidła wiązano z magią łowiecką: przedstawienie zwierzęcia miało zapewnić udane polowanie, dlatego często nakładano wizerunki jedne na drugie. Drugą grupą dzieł są niewielkie figurki kobiece, tzw. Wenus paleolityczne, np. Wenus z Willendorfu (ok. 25 000 lat p.n.e.). Przesadnie podkreślone piersi, brzuch i biodra przy prawie pominiętej twarzy wskazują na kult płodności i macierzyństwa.'],
    ['Neolit: megality i ceramika', 'W neolicie powstała architektura megalityczna, czyli budowle z ogromnych, ledwie obrobionych głazów. Menhir to pojedynczy pionowy kamień, dolmen – grobowiec z płyt nakrytych kamienną pokrywą, a kromlech – krąg kamieni. Najdoskonalszym kromlechem jest Stonehenge w Anglii, prawdopodobnie miejsce kultu związane z obserwacją słońca. Neolit przyniósł też ceramikę zdobioną ornamentem geometrycznym, układanym pasowo – sztuka „odwróciła się” od realizmu ku abstrakcji.'],

  ],

    ['Tło historyczne', 'Gotyk narodził się ok. 1140 r. we Francji, w Île-de-France, gdy opat Suger przebudował prezbiterium kościoła Saint-Denis. Rozwój miast, uniwersytetów, zakonów żebraczych i mieszczaństwa sprawił, że obok katedr powstawały ratusze, sukiennice i kamienice. Nazwa „gotyk” to renesansowa obelga (sztuka „barbarzyńskich Gotów”).'],
    ['Poglądy estetyczne', 'Suger rozumiał piękno jako światło przenikające materię i prowadzące ku Bogu („Bóg jest światłem”). Tomasz z Akwinu wymieniał warunki piękna: integralność, właściwą proporcję i jasność (claritas). Katedra była summą wiedzy – encyklopedią w kamieniu i szkle.'],
    ['Architektura', 'Kluczem był układ szkieletowy: sklepienie krzyżowo-żebrowe na łuku ostrym przenosiło ciężar na filary, a jego parcie boczne przejmowały łuki przyporowe i przypory. Ściany przestały być nośne i mogły zamienić się w witraże. Klasyczna katedra francuska (Chartres, Reims, Amiens, Notre-Dame w Paryżu) jest bazyliką z transeptem, obejściem i wieńcem kaplic, z dwuwieżową fasadą, trzema portalami i rozetą. W gotyku promienistym (rayonnant) mury niemal znikają (Sainte-Chapelle), a w gotyku płomienistym (flamboyant) maswerki przybierają falujące kształty. W Anglii wykształcił się styl perpendykularny ze sklepieniem wachlarzowym, w Niemczech i Europie Środkowej – kościół halowy. Poza Francją budowano też z cegły (gotyk ceglany nadbałtycki).'],
    ['Rzeźba', 'Rzeźba portalowa uwolniła się od muru: postacie z Chartres są jeszcze kolumnowe, a w Reims stoją swobodnie, uśmiechają się i rozmawiają (anioł uśmiechnięty, Nawiedzenie). W XIV w. pojawił się styl piękny – Piękne Madonny w esowatym wygięciu – oraz nurt ekspresyjny z drastycznymi Pietami i krucyfiksami. Na przełomie XV i XVI w. powstały wielkie ołtarze szafowe (Wit Stwosz, Michael Pacher).'],
    ['Malarstwo', 'Malarstwo rozwijało się w witrażach, iluminacjach i na tablicach ołtarzowych. Giotto di Bondone w kaplicy Scrovegnich w Padwie (ok. 1305) wprowadził bryłowatość postaci, przestrzeń i dramat – to protorenesans. Szkoła sieneńska (Duccio, Simone Martini) łączyła tradycję bizantyńską z gotycką elegancją. Ok. 1400 r. dominował styl międzynarodowy (Bardzo bogate godzinki księcia de Berry braci Limburg). W Niderlandach XV w. Jan van Eyck udoskonalił technikę olejną i stworzył malarstwo realistyczne, pełne symboli ukrytych w przedmiotach (Ołtarz Gandawski, Portret małżonków Arnolfinich). Rogier van der Weyden wniósł dramatyzm uczuć (Zdjęcie z krzyża), a Hieronim Bosch – fantastyczne, moralizatorskie wizje (Ogród rozkoszy ziemskich).']

  r: [
    ['Tło historyczne', 'Reformacja, wojny włoskie, złupienie Rzymu (Sacco di Roma, 1527) i odkrycie, że Ziemia nie jest centrum wszechświata, podważyły renesansowe poczucie ładu. Sztuka zwróciła się ku wyrafinowanym dworom (Florencja Medyceuszy, Fontainebleau, Praga Rudolfa II).'],

  lead: 'W pierwszych latach XX w. sztuka zerwała z naśladowaniem natury. Fowiści uwolnili kolor, ekspresjoniści – uczucie, kubiści rozbili przedmiot, a futuryści zachwycili się szybkością maszyn.',
  r: [
    ['Fowizm', 'Pierwszym stylem XX w. był fowizm. Na Salonie Jesiennym w 1905 r. krytyk Louis Vauxcelles nazwał malarzy „dzikimi bestiami” (les fauves). Fowiści – Henri Matisse, André Derain, Maurice de Vlaminck – malowali energicznie, czystymi, nasyconymi barwami, niezależnymi od natury (zielona twarz, czerwone drzewa), płaską plamą. Ojcem fowizmu był Gauguin. Matisse dążył do „sztuki równowagi, czystości i spokoju”, jak „dobry fotel” dla zmęczonego (Radość życia, Taniec, Czerwony pokój).'],
    ['Ekspresjonizm', 'Ekspresjonizm charakteryzuje się deformacją kształtów i koloru w celu wyrażenia emocji, często niepokoju i lęku. Rozwijał się głównie w Niemczech i Austrii. Grupa Die Brücke (Most, Drezno 1905: Ernst Ludwig Kirchner, Erich Heckel, Karl Schmidt-Rottluff, Emil Nolde) malowała ostrą, kanciastą plamą wielkomiejską ulicę i akty w naturze, rozwijając drzeworyt. Ważniejsza jest druga grupa – Der Blaue Reiter (Błękitny Jeździec, Monachium 1911: Wassily Kandinsky, Franz Marc, August Macke) – która szukała duchowych wartości koloru (niebieskie konie Marca). Kandinsky uznawany jest za twórcę abstrakcji (pierwsza akwarela abstrakcyjna ok. 1910). W Austrii działali Egon Schiele i Oskar Kokoschka (Narzeczona wiatru).'],

    ['Futuryzm', 'W tym samym czasie w Mediolanie poeta Filippo Tommaso Marinetti ogłosił Manifest futuryzmu (1909): „Pędzący automobil jest piękniejszy niż Nike z Samotraki”. Futuryści (Umberto Boccioni, Giacomo Balla, Gino Severini, Carlo Carrà) gloryfikowali technikę, miasto, szybkość i wojnę, chcieli zniszczyć muzea i tradycję. Malowali ruch przez powielanie kształtów i linie siły (Balla – Dynamizm psa na smyczy), a Boccioni w rzeźbie Jedyne formy ciągłości w przestrzeni pokazał ciało w ruchu.']

  r: [
    ['Dadaizm', 'Dada narodził się w 1916 r. w Zurychu, w Cabaret Voltaire, jako bunt przeciw wojnie i całej kulturze, która do niej doprowadziła. Nazwa była celowo bezsensowna. Dadaiści (Hans Arp, Tristan Tzara, Raoul Hausmann, Hannah Höch) wykorzystywali przypadek, fotomontaż i absurd. Marcel Duchamp wprowadził ready-made – gotowy przedmiot wybrany przez artystę i ogłoszony dziełem (Fontanna – pisuar, 1917; Mona Lisa z wąsami L.H.O.O.Q.). Man Ray dodawał do przedmiotów nieoczekiwane elementy (żelazko z gwoździami – Prezent) i tworzył rayografie. Kurt Schwitters, którego grupa nie przyjęła, stworzył własny ruch Merz – kolaże ze śmieci.'],
    ['Abstrakcja w Rosji i Holandii', 'W Rosji czasu rewolucji pojawiła się sztuka abstrakcyjna. Kazimierz Malewicz stworzył suprematyzm – „supremację czystego odczucia”: Czarny kwadrat na białym tle (1915) i Biały na białym. Konstruktywiści (Władimir Tatlin – projekt Pomnika III Międzynarodówki, Aleksandr Rodczenko, El Lissitzky) chcieli sztuki użytecznej, inżynieryjnej, służącej rewolucji (plakat, typografia, design). W Holandii wokół pisma De Stijl (Theo van Doesburg) Piet Mondrian stworzył neoplastycyzm: tylko linie poziome i pionowe, trzy barwy podstawowe oraz biel, czerń i szarość – wyraz uniwersalnej harmonii. Pochodną idei był dom Schrödera Gerrita Rietvelda. W Niemczech szkoła Bauhaus (Walter Gropius, 1919) łączyła sztukę, rzemiosło i przemysł. W Polsce działali konstruktywiści i unizm Władysława Strzemińskiego, a Katarzyna Kobro tworzyła rzeźby przestrzenne.'],
    ['Surrealizm', 'Surrealizm ogłosił André Breton w manifeście z 1924 r. Inspirował się psychoanalizą Freuda: chciał wyzwolić podświadomość, sny, wolne skojarzenia (automatyzm psychiczny). Ceniono spojrzenie dziecka, szaleńca i przypadek. Prekursorem był Giorgio de Chirico (malarstwo metafizyczne – puste place, długie cienie). Max Ernst stosował frotaż i dekalkomanię, Joan Miró tworzył biomorficzne znaki, René Magritte – paradoksy obrazu (Zdradliwość obrazów: „To nie jest fajka”). Najsłynniejszy był Salvador Dalí z hiperrealistycznymi wizjami (Trwałość pamięci – miękkie zegary), stosujący metodę paranoiczno-krytyczną.'],
    ['Nowa Rzeczowość i École de Paris', 'W dwudziestoleciu międzywojennym w Niemczech pojawiła się Nowa Rzeczowość (Neue Sachlichkeit): Otto Dix i George Grosz malowali z chłodną, bezlitosną precyzją okaleczonych weteranów, spekulantów i prostytutki Republiki Weimarskiej. W Paryżu działali artyści niezrzeszeni, nazywani École de Paris – często emigranci: Amedeo Modigliani (wydłużone portrety), Marc Chagall (baśniowe wspomnienia z Witebska), Chaim Soutine, Mojżesz Kisling, Tamara Łempicka (art déco). Nowe style pierwszej połowy XX w. zostały zahamowane przez totalitaryzmy: naziści potępili je jako „sztukę zdegenerowaną” (wystawa Entartete Kunst, 1937), a w ZSRS narzucono socrealizm.']
  ],

  terms: [['dadaizm', 'Ruch (1916) negujący sztukę i wartości kultury: prowokacja, absurd, przypadek.'], ['ready-made', 'Gotowy, fabryczny przedmiot ogłoszony przez artystę dziełem sztuki (Duchamp).'], ['fotomontaż', 'Kompozycja z wyciętych i zestawionych fragmentów fotografii.'], ['suprematyzm', 'Abstrakcja geometryczna Malewicza oparta na prostych figurach i „czystym odczuciu”.'], ['konstruktywizm', 'Kierunek traktujący sztukę jako konstrukcję i projektowanie użyteczne, związany z rewolucją.'], ['neoplastycyzm', 'Abstrakcja Mondriana: linie poziome i pionowe, barwy podstawowe, biel, czerń, szarość.'], ['De Stijl', 'Holenderska grupa i pismo (1917) – neoplastycyzm w malarstwie, architekturze i designie.'], ['surrealizm', 'Kierunek (1924) wyrażający podświadomość, sny i wolne skojarzenia.'], ['automatyzm psychiczny', 'Tworzenie bez kontroli rozumu, by wydobyć treści podświadome.'], ['frotaż', 'Przecieranie ołówkiem papieru położonego na fakturze (drewnie, liściu).'], ['Nowa Rzeczowość', 'Niemiecki nurt lat 20. – chłodny, krytyczny realizm (Dix, Grosz).'], ['Bauhaus', 'Niemiecka szkoła architektury, sztuki i projektowania (1919–1933).'], ['unizm', 'Teoria Strzemińskiego – jedność obrazu, bez kontrastów i podziałów.']],

function credit(w) {

<script>
// Generatory zadań. Każde zadanie: { kind, title, prompt, img, crop, opts:[{l,ok}], key, explain } lub typy specjalne (order, pairs, tf, open).
var EX_TYPES = [
  { id: 'dzielo', n: 'Rozpoznaj dzieło', d: 'Widzisz ilustrację – wybierz tytuł.', ic: 'image' },
  { id: 'autor', n: 'Kto jest autorem?', d: 'Rozpoznawanie artystów po ich dziełach.', ic: 'brush' },
  { id: 'epoka', n: 'Rozpoznaj styl i epokę', d: 'Po czym poznać gotyk, a po czym barok?', ic: 'columns' },
  { id: 'detal', n: 'Detektyw: szczegół', d: 'Tylko fragment obrazu. Co to za dzieło?', ic: 'zoom' },
  { id: 'pojecie', n: 'Pojęcia', d: 'Definicja → termin i odwrotnie.', ic: 'book' },
  { id: 'cecha', n: 'Cechy stylów', d: 'Do której epoki pasuje opisana cecha?', ic: 'quote' },
  { id: 'chrono', n: 'Oś czasu', d: 'Ułóż dzieła od najstarszego.', ic: 'clock' },
  { id: 'pary', n: 'Połącz w pary', d: 'Artysta ↔ dzieło.', ic: 'puzzle' },
  { id: 'miejsce', n: 'Gdzie to jest?', d: 'Miasta, muzea i kolekcje.', ic: 'pin' },
  { id: 'pf', n: 'Prawda czy fałsz', d: 'Szybkie twierdzenia o dziełach i stylach.', ic: 'check' },
  { id: 'otwarte', n: 'Pytania problemowe', d: 'Odpowiedz w myślach, potem porównaj.', ic: 'quote' },
  { id: 'mix', n: 'Mieszanka', d: 'Wszystkie typy zadań na zmianę.', ic: 'shuffle' }
];

// dystraktory: najpierw z tej samej lub sąsiedniej epoki, potem z całej puli
function distract(correct, pool, getLabel, n, near) {
  var seen = {}; seen[norm(getLabel(correct))] = 1;
  var out = [];
  var ordered = near ? shuffle(pool.filter(function (x) { return Math.abs(x.era.i - near.i) <= 2; })).concat(shuffle(pool)) : shuffle(pool);
  for (var i = 0; i < ordered.length && out.length < n; i++) {
    var l = getLabel(ordered[i]); if (!l) continue;
    var k = norm(l); if (seen[k]) continue; seen[k] = 1; out.push(l);
  }
  return out;
}
function opts(right, wrong) { return shuffle([{ l: right, ok: true }].concat(wrong.map(function (l) { return { l: l, ok: false }; }))); }
function workLine(w) { return '<b>' + esc(w.t) + '</b>' + (w.a ? ' · ' + esc(w.a) : '') + ' · ' + esc(w.y); }

var GEN = {
  dzielo: function (sc) {
    var pool = IMG_WORKS.filter(function (w) { return sc.indexOf(w.era) >= 0; }); if (pool.length < 2) return null;
    var w = pick(pool);
    return { kind: 'choice', title: 'Rozpoznaj dzieło', prompt: 'Jaki tytuł nosi to dzieło?', img: w, key: w.key,
      opts: opts(w.t, distract(w, IMG_WORKS, function (x) { return x.k === w.k || Math.random() < .3 ? x.t : null; }, 3, w.era)),
      explain: workLine(w) + '<br>' + esc(w.d) };
  },
  autor: function (sc) {
    var pool = IMG_WORKS.filter(function (w) { return w.a && sc.indexOf(w.era) >= 0; }); if (!pool.length) return null;
    var w = pick(pool);
    return { kind: 'choice', title: 'Kto jest autorem?', prompt: 'Kto stworzył „' + esc(w.t) + '”?', img: w, key: w.key,
      opts: opts(w.a, distract(w, WORKS.filter(function (x) { return x.a; }), function (x) { return x.a; }, 3, w.era)),
      explain: workLine(w) };
  },
  epoka: function (sc) {
    var pool = IMG_WORKS.filter(function (w) { return sc.indexOf(w.era) >= 0; }); if (!pool.length) return null;
    var w = pick(pool);
    var wrong = distract({ era: w.era, n: w.era.n }, ERAS.map(function (e) { return { era: e, n: e.n }; }), function (x) { return x.n; }, 3, w.era);
    return { kind: 'choice', title: 'Rozpoznaj styl i epokę', prompt: 'Do jakiej epoki lub kierunku należy to dzieło?', img: w, key: w.key,
      opts: opts(w.era.n, wrong), explain: workLine(w) + '<br><i>' + esc(w.era.n) + ', ' + esc(w.era.y) + '</i>' };
  },
  detal: function (sc) {
    var pool = IMG_WORKS.filter(function (w) { return w.k !== 'architektura' && sc.indexOf(w.era) >= 0; }); if (pool.length < 2) return null;
    var w = pick(pool);
    var crop = { x: 25 + Math.random() * 50, y: 25 + Math.random() * 50, z: 2.2 + Math.random() * .8 };
    return { kind: 'choice', title: 'Detektyw: szczegół', prompt: 'Z jakiego dzieła pochodzi ten fragment?', img: w, crop: crop, key: w.key,
      opts: opts(w.t, distract(w, IMG_WORKS.filter(function (x) { return x.k !== 'architektura'; }), function (x) { return x.t; }, 3, w.era)),
      explain: workLine(w) };
  },
  pojecie: function (sc) {
    var pool = TERMS.filter(function (t) { return sc.indexOf(t.era) >= 0; }); if (pool.length < 2) return null;
    var t = pick(pool);
    if (Math.random() < .6) return { kind: 'choice', title: 'Pojęcia', prompt: '<span class="def">' + esc(t.d) + '</span><br>Jak nazywa się to pojęcie?', key: t.key,
      opts: opts(t.t, distract(t, TERMS, function (x) { return x.t; }, 3, t.era)), explain: '<b>' + esc(t.t) + '</b> – ' + esc(t.d) };
    return { kind: 'choice', small: true, title: 'Pojęcia', prompt: 'Co oznacza termin <b>„' + esc(t.t) + '”</b>?', key: t.key,
      opts: opts(t.d, distract(t, TERMS, function (x) { return x.d; }, 3, t.era)), explain: '<b>' + esc(t.t) + '</b> – ' + esc(t.d) };
  },
  cecha: function (sc) {
    var pool = FEATS.filter(function (f) { return sc.indexOf(f.era) >= 0; }); if (!pool.length) return null;
    var f = pick(pool);
    var wrong = distract({ era: f.era, n: f.era.n }, ERAS.map(function (e) { return { era: e, n: e.n }; }), function (x) { return x.n; }, 3, f.era);
    return { kind: 'choice', title: 'Cechy stylów', prompt: 'Której epoki lub kierunku to cecha?<br><span class="def">„' + esc(f.t) + '”</span>', key: null,
      opts: opts(f.era.n, wrong), explain: 'Cecha: <b>' + esc(f.era.n) + '</b>. Pozostałe cechy: ' + esc(f.era.f.filter(function (x) { return x !== f.t; }).slice(0, 3).join('; ')) + '…' };
  },
  chrono: function (sc) {
    var pool = WORKS.filter(function (w) { return sc.indexOf(w.era) >= 0; });
    if (sc.length < 3) pool = WORKS.filter(function (w) { return Math.abs(w.era.i - sc[0].i) <= 3; });
    var items = [], used = {};
    shuffle(pool).forEach(function (w) {
      if (items.length >= 4) return;
      if (items.some(function (x) { return Math.abs(x.yr - w.yr) < 15; })) return;
      items.push(w);
    });
    if (items.length < 4) return null;
    return { kind: 'order', title: 'Oś czasu', prompt: 'Dotknij dzieł w kolejności od <b>najstarszego</b> do najmłodszego.', items: shuffle(items),
      answer: items.slice().sort(function (a, b) { return a.yr - b.yr; }) };
  },
  pary: function (sc) {
    var pool = WORKS.filter(function (w) { return w.a && sc.indexOf(w.era) >= 0; });
    if (sc.length < 3) pool = WORKS.filter(function (w) { return w.a && Math.abs(w.era.i - sc[0].i) <= 2; });
    var items = [], used = {};
    shuffle(pool).forEach(function (w) { if (items.length < 4 && !used[w.a]) { used[w.a] = 1; items.push(w); } });
    if (items.length < 3) return null;
    return { kind: 'pairs', title: 'Połącz w pary', prompt: 'Połącz artystę z jego dziełem.', items: items };
  },
  miejsce: function (sc) {
    var pool = WORKS.filter(function (w) { return w.p && w.p !== '—' && sc.indexOf(w.era) >= 0; }); if (!pool.length) return null;
    var w = pick(pool);
    return { kind: 'choice', title: 'Gdzie to jest?', prompt: 'Gdzie znajduje się „' + esc(w.t) + '”' + (w.a ? ' (' + esc(w.a) + ')' : '') + '?', img: w.img ? w : null, key: w.key,
      opts: opts(w.p, distract(w, WORKS.filter(function (x) { return x.p && x.p !== '—'; }), function (x) { return x.p; }, 3, w.era)), explain: workLine(w) + '<br>' + esc(w.p) };
  },
  pf: function (sc) {
    var pool = WORKS.filter(function (w) { return sc.indexOf(w.era) >= 0; }); if (!pool.length) return null;
    var w = pick(pool), truth = Math.random() < .5, st, kind = Math.random();
    if (w.a && kind < .45) {
      var other = truth ? w.a : distract(w, WORKS.filter(function (x) { return x.a; }), function (x) { return x.a; }, 1, w.era)[0];
      st = 'Autorem dzieła „' + esc(w.t) + '” jest <b>' + esc(other) + '</b>.';
    } else if (kind < .75) {
      var era = truth ? w.era : pick(ERAS.filter(function (e) { return e !== w.era && Math.abs(e.i - w.era.i) <= 4; }));
      st = '„' + esc(w.t) + '” to dzieło epoki: <b>' + esc(era.n) + '</b>.';
    } else {
      var t = pick(TERMS.filter(function (x) { return sc.indexOf(x.era) >= 0; })) || pick(TERMS);
      var def = truth ? t.d : pick(TERMS.filter(function (x) { return x !== t; })).d;
      return { kind: 'tf', title: 'Prawda czy fałsz', prompt: '<b>' + esc(t.t) + '</b> – ' + esc(def), truth: truth, key: t.key, explain: '<b>' + esc(t.t) + '</b> – ' + esc(t.d) };
    }
    return { kind: 'tf', title: 'Prawda czy fałsz', prompt: st, img: w.img ? w : null, truth: truth, key: w.key, explain: workLine(w) + ' — ' + esc(w.era.n) };
  },
  otwarte: function (sc) {
    var pool = []; sc.forEach(function (e) { (e.q || []).forEach(function (q) { pool.push({ q: q[0], a: q[1], era: e }); }); });
    if (!pool.length) return null;
    var q = pick(pool);
    return { kind: 'open', title: 'Pytanie problemowe · ' + q.era.n, prompt: esc(q.q), answer: esc(q.a) };
  }
};

function makeQuestion(type, scope) {
  for (var tries = 0; tries < 12; tries++) {
    var t = type === 'mix' ? pick(['dzielo', 'dzielo', 'autor', 'epoka', 'detal', 'pojecie', 'pojecie', 'cecha', 'chrono', 'pary', 'miejsce', 'pf']) : type;
    var q = GEN[t](scope); if (q) { q.type = t; return q; }
  }
  return null;
}

<script>

/* ---------- KATALOG EPOK ---------- */

function goalRing() {
  var p = Math.min(1, xpToday() / GOAL), r = 26, c = 2 * Math.PI * r;
  return '<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="' + r + '"/><circle class="v" cx="32" cy="32" r="' + r + '" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - p)) + '"/><text x="32" y="37">' + xpToday() + '</text></svg>';

function scopeEras(s) {
  if (!s || s === 'all') return ERAS.slice();

var QZ = null;
V.quiz = function (type, scope) {
  QZ = { type: type, scope: scopeEras(scope), scopeId: scope, n: 0, good: 0, total: 10, q: null };
  return '<section class="quiz" id="quiz"></section>';
};
V.quiz.after = function () { nextQ(); };
function nextQ() {
  if (QZ.n >= QZ.total) return quizEnd();
  QZ.q = makeQuestion(QZ.type, QZ.scope); QZ.n++; QZ.done = false;
  if (!QZ.q) { $('#quiz').innerHTML = '<p class="empty">Za mało materiału w tym zakresie. Wybierz szerszy zakres.</p><a class="btn wide" href="#/cwicz">Wróć</a>'; return; }
  var q = QZ.q;
  var h = '<div class="qz-top"><button class="sq" onclick="goBack()" aria-label="Zamknij">' + ic('close') + '</button>' +
    '<div class="qz-bar"><i style="width:' + ((QZ.n - 1) / QZ.total * 100) + '%"></i></div><span class="qz-xp">' + ic('flame') + xpToday() + '</span></div>' +
    '<p class="qz-kind">' + esc(q.title) + '</p>';
  if (q.img) {
    var st = q.crop ? ' style="transform:scale(' + q.crop.z + ');transform-origin:' + q.crop.x + '% ' + q.crop.y + '%"' : '';
    h += '<div class="qz-img' + (q.crop ? ' crop' : '') + '"><img src="' + imgSrc(q.img) + '" alt=""' + st + '></div>';
  }
  h += '<h2 class="qz-q">' + q.prompt + '</h2>';
  if (q.kind === 'choice') h += '<div class="opts' + (q.small ? ' small' : '') + '">' + q.opts.map(function (o, i) { return '<button onclick="answer(' + i + ')">' + esc(o.l) + '</button>'; }).join('') + '</div>';
  else if (q.kind === 'tf') h += '<div class="opts tf"><button onclick="answerTF(true)">' + ic('check') + 'Prawda</button><button onclick="answerTF(false)">' + ic('x') + 'Fałsz</button></div>';
  else if (q.kind === 'order') { q.picked = []; h += '<div class="order">' + q.items.map(function (w, i) { return '<button onclick="pickOrder(' + i + ',this)">' + imgTag(w) + '<span>' + esc(w.t) + '</span><em></em></button>'; }).join('') + '</div>'; }
  else if (q.kind === 'pairs') {
    q.left = shuffle(q.items); q.right = shuffle(q.items); q.sel = null; q.matched = 0; q.err = 0;
    h += '<div class="pairs"><div>' + q.left.map(function (w, i) { return '<button data-l="' + i + '" onclick="pairL(' + i + ',this)">' + esc(w.a) + '</button>'; }).join('') + '</div><div>' +
      q.right.map(function (w, i) { return '<button data-r="' + i + '" onclick="pairR(' + i + ',this)">' + (w.img ? imgTag(w) : '') + '<span>' + esc(w.t) + '</span></button>'; }).join('') + '</div></div>';
  } else if (q.kind === 'open') h += '<div class="open"><button class="btn wide" onclick="this.parentNode.classList.add(\'on\')">Pokaż odpowiedź</button><div class="ans"><p>' + q.answer + '</p><p class="muted">Czy Twoja odpowiedź zawierała te elementy?</p><div class="opts tf"><button onclick="openGrade(true)">' + ic('check') + 'Tak</button><button onclick="openGrade(false)">' + ic('x') + 'Nie całkiem</button></div></div></div>';
  h += '<div class="feedback" id="fb"></div>';
  $('#quiz').innerHTML = h; window.scrollTo(0, 0);
}
function feedback(ok, html) {
  QZ.done = true;
  if (ok) { QZ.good++; addXP(1); }
  if (QZ.q.key) mark(QZ.q.key, ok);
  var fb = $('#fb'); fb.className = 'feedback on ' + (ok ? 'good' : 'bad');
  fb.innerHTML = '<b>' + (ok ? ic('check') + ' Dobrze!' : ic('x') + ' Nie tym razem') + '</b>' + (html ? '<p>' + html + '</p>' : '') +
    (QZ.q.img && QZ.q.img.id ? '<a class="more" href="#/dzielo/' + QZ.q.img.id + '">Zobacz dzieło</a>' : '') +
    '<button class="btn primary wide" onclick="nextQ()">' + (QZ.n >= QZ.total ? 'Podsumowanie' : 'Dalej') + '</button>';
  var im = $('.qz-img img'); if (im) im.style.transform = 'none';
}
function answer(i) {
  if (QZ.done) return;
  var q = QZ.q, ok = q.opts[i].ok;
  $$('.opts button').forEach(function (b, j) { b.disabled = true; if (q.opts[j].ok) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
  feedback(ok, q.explain);
}
function answerTF(v) {
  if (QZ.done) return;
  var ok = v === QZ.q.truth;
  $$('.opts button').forEach(function (b, j) { b.disabled = true; if ((j === 0) === QZ.q.truth) b.classList.add('right'); else if ((j === 0) === v) b.classList.add('wrong'); });
  feedback(ok, (QZ.q.truth ? 'To prawda. ' : 'To fałsz. ') + QZ.q.explain);
}
function pickOrder(i, el) {
  var q = QZ.q; if (QZ.done || q.picked.indexOf(i) >= 0) return;
  q.picked.push(i); el.classList.add('picked'); $('em', el).textContent = q.picked.length;
  if (q.picked.length === q.items.length) {
    var ok = q.picked.every(function (p, k) { return q.items[p] === q.answer[k]; });
    feedback(ok, 'Kolejność: ' + q.answer.map(function (w) { return '<b>' + esc(w.t) + '</b> (' + esc(w.y) + ')'; }).join(' → '));
    q.answer.forEach(function (w) { if (ok) mark(w.key, true); });
  }
}
function pairL(i, el) { if (QZ.done || el.classList.contains('right')) return; $$('.pairs [data-l]').forEach(function (b) { b.classList.remove('sel'); }); el.classList.add('sel'); QZ.q.sel = i; }
function pairR(i, el) {
  var q = QZ.q; if (QZ.done || q.sel == null || el.classList.contains('right')) return;
  var l = $('.pairs [data-l="' + q.sel + '"]');
  if (q.left[q.sel] === q.right[i]) {
    l.classList.remove('sel'); l.classList.add('right'); el.classList.add('right'); q.matched++; mark(q.right[i].key, true);
    if (q.matched === q.items.length) feedback(q.err === 0, q.err ? 'Pomyłek: ' + q.err + '. ' + q.items.map(function (w) { return esc(w.a) + ' – <b>' + esc(w.t) + '</b>'; }).join('; ') : q.items.map(function (w) { return esc(w.a) + ' – <b>' + esc(w.t) + '</b>'; }).join('; '));
  } else { q.err++; el.classList.add('shake'); setTimeout(function () { el.classList.remove('shake'); }, 400); }
  q.sel = null;
}
function openGrade(ok) { $$('.open .opts button').forEach(function (b) { b.disabled = true; }); feedback(ok, ''); }
function quizEnd() {
  var p = Math.round(QZ.good / QZ.total * 100);
  $('#quiz').innerHTML = '<div class="end">' + goalRing() + '<h2>' + QZ.good + ' / ' + QZ.total + '</h2><p>' +
    (p >= 90 ? 'Znakomicie – mistrzowska znajomość!' : p >= 60 ? 'Dobra robota. Jeszcze trochę i będzie perfekcyjnie.' : 'Warto wrócić do lektury i fiszek tej epoki.') + '</p>' +

    '<button class="btn primary wide" onclick="render()">Jeszcze raz</button><a class="btn wide" href="#/cwicz">Inne ćwiczenia</a></div>';
}

V.fiszki = function () {

function deckCards(deck, scope) {

  if (deck === 'pojecia') return TERMS.filter(inS).map(function (t) { return { key: 'f|' + t.key, front: '<h2>' + esc(t.t) + '</h2><span class="muted">' + esc(t.era.n) + '</span>', back: '<p>' + esc(t.d) + '</p>', mk: t.key }; });

  if (deck === 'artysci') return ARTISTS.filter(inS).map(function (a) { return { key: 'f|a|' + a.n, front: '<h2>' + esc(a.n) + '</h2><span class="muted">' + esc(a.y) + '</span><p class="muted">Epoka? Najważniejsze dzieła?</p>', back: '<p><b>' + esc(a.era.n) + '</b></p><p>' + esc(a.d) + '</p>' }; });

}
var FC = null;
V.fiszkiRun = function (deck, scope) {
  var cards = deckCards(deck, scope);
  // najpierw najniższe pudełka, losowo w obrębie pudełka
  cards = shuffle(cards).sort(function (a, b) { return (S.box[a.key] || 0) - (S.box[b.key] || 0); }).slice(0, 20);
  FC = { cards: cards, i: 0, known: 0 };
  return '<section class="flash" id="flash"></section>';
};
V.fiszkiRun.after = function () { showCard(); };
function showCard() {
  if (!$('#flash')) return;
  if (FC.i >= FC.cards.length) {
    $('#flash').innerHTML = '<div class="end"><h2>Koniec talii</h2><p>Znane: ' + FC.known + ' / ' + FC.cards.length + '</p><button class="btn primary wide" onclick="render()">Kolejne 20 kart</button><a class="btn wide" href="#/fiszki">Inne talie</a></div>';
    return;
  }
  var c = FC.cards[FC.i], box = S.box[c.key] || 0;
  $('#flash').innerHTML = '<div class="qz-top"><button class="sq" onclick="goBack()" aria-label="Zamknij">' + ic('close') + '</button><div class="qz-bar"><i style="width:' + (FC.i / FC.cards.length * 100) + '%"></i></div><span class="qz-xp">' + (FC.i + 1) + '/' + FC.cards.length + '</span></div>' +
    '<div class="fcard" id="fcard" onclick="this.classList.toggle(\'flip\')"><div class="face front">' + c.front + '<span class="hint">dotknij, by odwrócić</span></div><div class="face back">' + c.back + '</div></div>' +
    '<p class="boxes">' + [0, 1, 2, 3, 4].map(function (b) { return '<i class="' + (b <= box ? 'on' : '') + '"></i>'; }).join('') + '</p>' +
    '<div class="opts tf"><button onclick="rate(false)">' + ic('x') + 'Jeszcze nie</button><button onclick="rate(true)">' + ic('check') + 'Wiem</button></div>';
}
function rate(ok) {
  var c = FC.cards[FC.i];
  if (!$('#fcard').classList.contains('flip') && ok) { $('#fcard').classList.add('flip'); }
  S.box[c.key] = ok ? Math.min(4, (S.box[c.key] || 0) + 1) : 0;
  if (ok) { FC.known++; addXP(1); }
  if (c.mk) mark(c.mk, ok);
  save(); FC.i++; setTimeout(showCard, ok ? 250 : 0);
}

  var days = [], d = new Date();
  for (var i = 13; i >= 0; i--) { var x = new Date(d); x.setDate(d.getDate() - i); var k = x.getFullYear() + '-' + (x.getMonth() + 1) + '-' + x.getDate(); days.push({ n: S.xp[k] || 0, l: x.getDate() }); }
  var max = Math.max(GOAL, Math.max.apply(null, days.map(function (x) { return x.n; })));
  var okW = WORKS.filter(function (w) { return S.ok[w.key] > 0; }).length, okT = TERMS.filter(function (t) { return S.ok[t.key] > 0; }).length;
  return header({ title: 'Postępy' }) + '<div class="pad">' +
    '<div class="goal">' + goalRing() + '<div><b>Dziś ' + xpToday() + ' / ' + GOAL + ' XP</b><span class="muted">Razem ' + xpTotal() + ' XP · seria ' + streak() + ' ' + plural(streak(), 'dzień', 'dni', 'dni') + '</span></div></div>' +
    '<div class="days">' + days.map(function (x) { return '<div><i style="height:' + Math.round(x.n / max * 100) + '%" class="' + (x.n >= GOAL ? 'full' : '') + '"></i><span>' + x.l + '</span></div>'; }).join('') + '</div>' +
    '<div class="kpis"><div><b>' + okW + '</b><span>dzieł rozpoznanych<br>z ' + WORKS.length + '</span></div><div><b>' + okT + '</b><span>pojęć opanowanych<br>z ' + TERMS.length + '</span></div><div><b>' + Object.keys(S.read).filter(function (k) { return S.read[k]; }).length + '</b><span>rozdziałów<br>przeczytanych</span></div></div>' +
    '<h2 class="sec">Epoki</h2>' + ERAS.map(function (e) { var p = eraProgress(e); return '<a class="prog" href="#/epoka/' + e.id + '"><span>' + esc(e.n) + '</span><div class="bar"><i style="width:' + p + '%"></i></div><b>' + p + '%</b></a>'; }).join('') +
    '<h2 class="sec">Ustawienia</h2><div class="settings"><button class="btn" onclick="toggleTheme()">' + ic(S.theme === 'dark' ? 'sun' : 'moon') + (S.theme === 'dark' ? ' Jasny motyw' : ' Ciemny motyw') + '</button>' +
    '<button class="btn" onclick="exportData()">Kopia postępów</button><label class="btn">Wczytaj kopię<input type="file" accept=".json" hidden onchange="importData(this)"></label>' +
    '<button class="btn danger" onclick="resetAll()">Wyzeruj postępy</button></div>' +
    '<p class="src">Treści opracowane na podstawie: B. Lewińska, W.J. Kieler, „Ars longa” t. I–III oraz notatek „Dzieje sztuki europejskiej od XIV do XX w.”. Ilustracje: Wikimedia Commons (licencje przy każdym dziele) i podręcznik „Ars longa”.</p></div>';
};
function exportData() {
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' }));
  a.download = 'ars-postepy-' + today() + '.json'; a.click();
}
function importData(inp) {
  var f = inp.files[0]; if (!f) return; var r = new FileReader();
  r.onload = function () { try { var d = JSON.parse(r.result); for (var k in d) S[k] = d[k]; save(); render(); toast('Wczytano kopię'); } catch (e) { toast('Nieprawidłowy plik'); } };
  r.readAsText(f);
}
function resetAll() { if (confirm('Na pewno wyzerować XP, fiszki i postępy?')) { S.xp = {}; S.ok = {}; S.box = {}; S.read = {}; save(); render(); } }
function toggleTheme() { S.theme = S.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); render(); }
function applyTheme() { document.documentElement.setAttribute('data-theme', S.theme); var m = $('meta[name=theme-color]'); if (m) m.content = S.theme === 'dark' ? '#16130f' : '#f3f1ee'; }

/* ---------- MENU BOCZNE ---------- */
function openMenu() {
  var m = document.createElement('div'); m.className = 'drawer'; m.onclick = function (e) { if (e.target === m) m.remove(); };
  m.innerHTML = '<nav><span class="brand big">Ars</span>' +
    [['#/', 'sun', 'Ekran startowy'], ['#/epoki', 'columns', 'Epoki'], ['#/os', 'clock', 'Oś czasu'], ['#/galeria', 'image', 'Galeria'], ['#/artysci', 'brush', 'Artyści'], ['#/slownik', 'book', 'Słownik pojęć'], ['#/cwicz', 'puzzle', 'Ćwiczenia'], ['#/fiszki', 'cards', 'Fiszki'], ['#/postepy', 'chart', 'Postępy']]
      .map(function (x) { return '<a href="' + x[0] + '" onclick="this.closest(\'.drawer\').remove()">' + ic(x[1]) + x[2] + '</a>'; }).join('') + '</nav>';
  document.body.appendChild(m); setTimeout(function () { m.classList.add('on'); }, 10);
}

</script>
<script>
// Router (hash) i dolna nawigacja.
var NAV = [['#/epoki', 'columns', 'Epoki'], ['#/galeria', 'image', 'Galeria'], ['#/cwicz', 'puzzle', 'Ćwicz'], ['#/fiszki', 'cards', 'Fiszki'], ['#/postepy', 'chart', 'Postępy']];
var HIST = [];

function route() {
  var p = location.hash.replace(/^#\/?/, '').split('/');
  switch (p[0]) {
    case '': return S.seenStart ? ['epoki'] : ['start'];
    default: return p;
  }
}
function render() {
  var r = route(), name = r[0], view;
  if (name === 'start') view = V.start;
  else if (name === 'epoka') view = V.epoka;
  else if (name === 'dzielo') view = V.dzielo;
  else if (name === 'quiz') view = V.quiz;
  else if (name === 'fiszki' && r[1]) view = V.fiszkiRun;
  else view = V[name] || V.epoki;
  if (location.hash === '#/' || location.hash === '#') view = V.start;
  var app = $('#app');
  app.className = 'v-' + (view === V.start ? 'start' : name);
  app.innerHTML = view.apply(null, r.slice(1));
  var full = view === V.start || view === V.dzielo || view === V.quiz || view === V.fiszkiRun;
  $('#nav').style.display = full ? 'none' : '';
  $('#nav').innerHTML = NAV.map(function (n) { return '<a href="' + n[0] + '" class="' + (('#/' + name) === n[0] || (name === 'epoka' && n[0] === '#/epoki') ? 'on' : '') + '">' + ic(n[1]) + '<span>' + n[2] + '</span></a>'; }).join('');
  if (view.after) view.after.apply(null, r.slice(1));
}
function goBack() { if (HIST.length > 1) { HIST.pop(); history.back(); } else location.hash = '#/epoki'; }

window.addEventListener('hashchange', function () {
  HIST.push(location.hash);
  var keepScroll = /^#\/epoka\/[^/]+\/(dziela|pojecia|artysci|cwicz|czytaj)$/.test(location.hash) && HIST.length > 1 && HIST[HIST.length - 2].split('/')[2] === location.hash.split('/')[2];
  var y = window.scrollY;
  render();
  window.scrollTo(0, keepScroll ? Math.min(y, $('.era-tabs') ? $('.era-tabs').offsetTop : 0) : 0);
});
document.addEventListener('keydown', function (e) {
  if (!QZ || !$('#quiz')) return;
  if (QZ.done && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextQ(); }
  else if (!QZ.done && /^[1-4]$/.test(e.key) && QZ.q && QZ.q.kind === 'choice') answer(+e.key - 1);
});
applyTheme();
HIST.push(location.hash);
render();

</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js');</script>
